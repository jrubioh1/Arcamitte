[tool.poetry]
name = "arcamitte"
version = "1.0.0"
description = "Arcamitte - Microservicio Autónomo de Custodia Criptográfica y Trámite Confidencial"
authors = ["Jorge <jrubioh@pm.me>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/jrubioh1/Arcamitte"
keywords = ["django", "django-rest-framework", "security", "cryptography", "fernet", "sha256", "zero-knowledge", "nist-sp-800-88"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
packages = [{include = "arcamitte"}]
include = [
    "arcamitte/templates/**/*",
    "arcamitte/static/**/*",
    "arcamitte/locale/**/*",
    "LICENSE",
]

[tool.poetry.dependencies]
python = "^3.11"
django = ">=5.2.19,<7.0"
djangorestframework = ">=3.18.3"
cryptography = ">=50.0.2"
drf-spectacular = "^0.30.0"
segno = "^1.6.6"
pypdf = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.2.0"
pytest-django = ">=4.14.0"
black = ">=26.10.1"
flake8 = "^7.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
