{% extends "admin/change_form.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Reseteo defensivo para labels y contenedores dentro de widgets de Arcamitte */
    .aligned .admin-email-row label,
    .aligned .member-item-row label,
    .aligned #id_allowed_emails_admin_wrapper label,
    .aligned [id$="_helper_box"] label {
        width: auto !important;
        min-width: 0 !important;
        max-width: 100% !important;
        float: none !important;
        display: inline-flex !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .aligned .member-item-row {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    .aligned [id$="_helper_box"] {
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    .admin-email-row input[type="email"] {
        max-width: 100% !important;
    }

    .inline-group div.readonly {
        word-break: break-all !important;
        overflow-wrap: anywhere !important;
    }

    /* Adaptación móvil para formularios en Django Admin */
    @media (max-width: 768px) {
        .aligned label {
            width: 100% !important;
            float: none !important;
            margin-bottom: 6px !important;
            display: block !important;
        }
        .aligned .form-row {
            padding: 10px 0 !important;
            display: flex !important;
            flex-direction: column !important;
        }
        .form-row > div {
            width: 100% !important;
            max-width: 100% !important;
        }
        div[id$="_helper_box"] {
            max-width: 100% !important;
            padding: 10px !important;
        }
        div[id$="_admin_wrapper"] {
            max-width: 100% !important;
        }
    }
</style>
{% endblock %}
